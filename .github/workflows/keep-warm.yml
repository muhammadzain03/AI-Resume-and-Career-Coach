name: Keep backend warm

# Render's free tier spins the backend down after ~15 minutes of inactivity,
# which causes a 30-60s cold start on the next request (this is what makes the
# first Google/email sign-in feel slow). This workflow pings the lightweight
# health endpoint on a schedule so the service stays awake.
#
# Setup: set a repository variable named BACKEND_URL to your Render base URL,
#   e.g. https://rcc-backend.onrender.com
#   (GitHub -> repo -> Settings -> Secrets and variables -> Actions -> Variables)
# If you don't set it, the fallback below is used.
#
# Notes:
#   - GitHub may delay scheduled runs under load; ~10 min is a safe target.
#   - Scheduled workflows are auto-disabled after 60 days with no repo activity;
#     any push re-enables them.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (under Render's 15-min idle window)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          BASE="${{ vars.BACKEND_URL || 'https://rcc-backend.onrender.com' }}"
          echo "Pinging $BASE/api/auth/health"
          # A cold start can take up to ~60s; give it headroom. Never fail the
          # job on a slow/cold response - the point is just to wake the service.
          curl -fsS --max-time 90 "$BASE/api/auth/health" \
            && echo "OK" \
            || echo "Ping did not return OK (service may have been cold-starting)"
