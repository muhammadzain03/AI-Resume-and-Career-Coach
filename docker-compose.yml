services:

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - database
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: arcc
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - backend
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      REACT_APP_API_BASE: http://localhost:5000/api

  database:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arcc
    volumes:
      # Postgres 18+ images store data in a version-specific subdirectory, so the
      # persistent volume mounts at /var/lib/postgresql (not /.../data).
      - postgres_data:/var/lib/postgresql
      # Directory mount runs *.sql on first init (empty data dir only)
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
